<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d14">
<title>S.W.A.T. REDLINE | Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080c12;--panel:#101722;--panel2:#141e2b;--line:#273445;--red:#ed3545;--red2:#a91929;--muted:#8d9caf;--text:#f1f5fb;--green:#5addaa;--amber:#f0bd6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#3a151c 0,transparent 36%),linear-gradient(140deg,#080c12,#0c1119);color:var(--text);font-family:Inter,"Noto Kufi Arabic",Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{height:82px;border-bottom:1px solid var(--line);background:#0b1018eF;display:flex;align-items:center;gap:15px;padding:0 25px;position:sticky;top:0;z-index:20;backdrop-filter:blur(18px)}
.mark{width:47px;height:47px;border-radius:13px;border:1px solid #702833;background:linear-gradient(145deg,#3b161e,#131923);display:grid;place-items:center;color:#ff5d69;font-size:22px;font-weight:900}
.brand b{display:block;font-size:16px;letter-spacing:1.3px}.brand span{display:block;margin-top:3px;color:#9aa7b8;font-size:9px;letter-spacing:3px;font-weight:800}
.top-right{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #3a485b;background:#172130;color:#f3f6fb;padding:10px 14px;border-radius:9px;font-size:11px;font-weight:800;transition:.18s}.btn:hover{border-color:#e44755;transform:translateY(-1px)}.btn.primary{background:linear-gradient(120deg,#ad1b2a,#ed3545);border-color:#ed3545}.btn.danger{background:#2b131a;border-color:#79313c;color:#ff9aa2}.btn:disabled{opacity:.48;cursor:not-allowed;transform:none}
.status{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;background:#142820;border:1px solid #285941;color:#7fe5ba;border-radius:99px;font-size:10px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:calc(100vh - 82px)}
.side{padding:18px 13px;border-inline-end:1px solid var(--line);background:#0b111a;display:flex;flex-direction:column;gap:6px}
.side-label{color:#697b90;font-size:9px;letter-spacing:2px;font-weight:900;padding:8px 11px 12px}
.side button{display:flex;align-items:center;gap:11px;padding:12px 11px;border:1px solid transparent;border-radius:10px;background:transparent;color:#a7b4c5;text-align:start;font-size:11px;font-weight:700}
.side button .ic{width:23px;color:#e84a59;text-align:center;font-size:17px}
.side button.active,.side button:hover{background:linear-gradient(100deg,#35171d,#151d29);border-color:#662832;color:#fff;box-shadow:inset 3px 0 var(--red)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:15px 10px;color:#637286;font-size:9px;line-height:2;letter-spacing:1px}
.main{min-width:0;padding:24px;max-width:1600px;width:100%;margin:0 auto}
.view-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap;margin-bottom:19px}
.view-head h1{font-size:22px;margin:0;font-weight:900}.view-head p{font-size:11px;color:var(--muted);margin:7px 0 0;line-height:1.9}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:linear-gradient(145deg,#151f2c,#0e151e);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.kicker{color:#93a1b3;font-size:10px}.value{font-size:23px;font-weight:900;margin-top:7px;overflow-wrap:anywhere}.caption{font-size:9px;color:#6f7e90;margin-top:5px}
.panel{background:#0e1621;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;min-width:0}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:13px;margin:0}.panel-body{padding:15px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch{width:40px;height:22px;appearance:none;background:#344052;border:1px solid #4b5a6d;border-radius:99px;position:relative;cursor:pointer;transition:.18s;vertical-align:middle}.switch:before{content:"";position:absolute;width:14px;height:14px;top:3px;left:3px;border-radius:50%;background:#d8e0e9;transition:.18s}.switch:checked{background:#b82234;border-color:#f04a59}.switch:checked:before{left:21px;background:#fff}.checkline{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;cursor:pointer}.log-event-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.log-event{display:flex;align-items:center;gap:8px;background:#111c28;border:1px solid #27384a;border-radius:8px;padding:8px 10px;font-size:10px;color:#c5d1df}.log-event input{accent-color:#ec3545}.log-category{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,.75fr);gap:13px;align-items:start}.status-note{font-size:10px;line-height:1.8;color:#95a4b6}.settings-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.welcome-token{display:inline-block;border:1px solid #3c4c60;background:#182434;border-radius:6px;padding:3px 7px;margin:2px;font:10px monospace;color:#d5e1ef}@media(max-width:720px){.log-event-grid,.log-category{grid-template-columns:1fr}}
.muted{color:var(--muted);font-size:10px;line-height:1.9}.field{display:grid;gap:7px;margin-bottom:13px;min-width:0}.field label{font-size:10px;color:#b7c2d0;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #39485a;background:#080e16;color:#f1f5fb;outline:none;font-size:11px}
.field textarea{min-height:130px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#ec4654;box-shadow:0 0 0 3px #ec465419}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;font-size:9px;font-weight:900;background:#142a24;border:1px solid #285943;color:#77e2b5}.badge.warn{background:#302516;border-color:#65502f;color:#f2c477}.badge.neutral{background:#1c2938;border-color:#364b63;color:#afc2d9}
.list{display:grid;gap:7px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;background:#121c28;border:1px solid #29384a;border-radius:9px;font-size:10px;min-width:0}.item span:first-child{overflow-wrap:anywhere}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:7px;vertical-align:middle}
.notice{border:1px solid #6c512d;background:#241e14;color:#ead8b4;border-radius:10px;padding:12px 14px;font-size:10px;line-height:1.9;margin:12px 0}
.empty{padding:25px;border:1px dashed #354457;border-radius:10px;color:#8e9caf;text-align:center;font-size:11px;line-height:1.9}
.table-wrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:480px}.table th,.table td{padding:10px 12px;border-bottom:1px solid #273444;text-align:start;font-size:10px}.table th{color:#8f9fb1;background:#121c28}.table td{color:#dce5f1}
.loading{display:grid;place-items:center;min-height:180px;color:#9aa8b9;font-size:11px}.spinner{width:26px;height:26px;border:2px solid #364252;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
.toast{position:fixed;bottom:22px;left:22px;z-index:100;background:#142a20;border:1px solid #32664b;color:#c1f3d7;padding:12px 17px;border-radius:10px;font-size:11px;box-shadow:0 12px 30px #0008;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:205px minmax(0,1fr)}}
@media(max-width:720px){.top{height:auto;min-height:70px;padding:10px 12px;flex-wrap:wrap}.top-right{width:100%;margin:0}.top-right .btn{flex:1}.layout{grid-template-columns:1fr}.side{border-inline-end:0;border-bottom:1px solid var(--line);display:flex;flex-direction:row;overflow:auto;padding:8px}.side-label,.side-foot{display:none}.side button{white-space:nowrap;min-width:max-content;padding:10px}.main{padding:13px}.grid,.grid.two,.split{grid-template-columns:1fr}.value{font-size:20px}}
</style>
<style>
.welcome-builder-grid{display:grid;grid-template-columns:minmax(300px,.92fr) minmax(0,1.08fr);gap:14px;align-items:start}
.welcome-builder-controls{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}
.welcome-builder-controls .field{margin-bottom:11px}
.welcome-builder-controls .field.full{grid-column:1/-1}
.welcome-layout-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.welcome-layout-choice{display:grid;gap:6px;place-items:center;min-width:0;padding:7px 5px;border:1px solid #344255;border-radius:9px;background:#121b27;color:#aeb9c7;font-size:9px;font-weight:800}
.welcome-layout-choice[aria-pressed="true"]{border-color:#f04a59;box-shadow:0 0 0 2px #f04a5922;color:#fff;background:#27171d}
.welcome-layout-art{width:100%;height:36px;border-radius:5px;background:#3b286b;display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden}
.welcome-layout-art i{display:block;width:27px;height:27px;border-radius:50%;background:#efb16c;flex:0 0 auto}
.welcome-layout-art b{display:grid;gap:3px;width:40px}
.welcome-layout-art b:before,.welcome-layout-art b:after{content:"";display:block;height:4px;border-radius:5px;background:#e0e0e8}
.welcome-layout-art b:after{width:70%;background:#a4a2bb}
.welcome-layout-choice[data-layout="classic"] .welcome-layout-art{flex-direction:column;gap:1px}
.welcome-layout-choice[data-layout="classic"] .welcome-layout-art i{width:13px;height:13px}
.welcome-layout-choice[data-layout="classic"] .welcome-layout-art b{width:31px;gap:2px}
.welcome-layout-choice[data-layout="classic"] .welcome-layout-art b:before,.welcome-layout-choice[data-layout="classic"] .welcome-layout-art b:after{height:3px}
.welcome-layout-choice[data-layout="text"] .welcome-layout-art i{display:none}
.welcome-layout-choice[data-layout="text"] .welcome-layout-art b{width:57px}
.welcome-shape-row{display:flex;gap:7px}
.welcome-shape-choice{min-width:42px;height:34px;border:1px solid #344255;border-radius:8px;background:#121b27;color:#c7d0dc;font-size:11px}
.welcome-shape-choice[aria-pressed="true"]{border-color:#f04a59;color:#fff;background:#27171d}
.welcome-color-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.welcome-color-control{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid #39485a;border-radius:9px;background:#080e16;padding:7px 9px}
.welcome-color-control input[type="color"]{width:32px;height:28px;padding:0;border:0;background:transparent;flex:0 0 auto;cursor:pointer}
.welcome-color-control span{font:10px monospace;color:#cbd5e1}
.welcome-range-row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:9px;align-items:center}
.welcome-range-row input{accent-color:#ed3545;padding:0}
.welcome-range-row output{font:10px monospace;color:#cbd5e1;text-align:end}
.welcome-preview-frame{position:sticky;top:98px;min-width:0}
.welcome-preview-card{position:relative;isolation:isolate;width:100%;aspect-ratio:1200/630;overflow:hidden;border:1px solid #39485a;border-radius:13px;background:#11151d;background-size:cover;background-position:center;box-shadow:0 20px 45px #0005;color:#fff;display:grid;place-items:center}
.welcome-preview-card:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(145deg,#05070b74,#05070b12 50%,#05070b99)}
.welcome-preview-card:after{content:"";position:absolute;z-index:0;right:-4%;top:-28%;width:34%;aspect-ratio:1;border:1px solid color-mix(in srgb,var(--welcome-accent) 40%,transparent);border-radius:50%;box-shadow:0 0 0 17px color-mix(in srgb,var(--welcome-accent) 10%,transparent),0 0 0 38px color-mix(in srgb,var(--welcome-accent) 6%,transparent);pointer-events:none}
.welcome-preview-shade{position:absolute;inset:0;z-index:-1;pointer-events:none}
.welcome-preview-bottom-line{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--welcome-accent);opacity:.75}
.welcome-preview-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.1%;width:100%;height:100%;padding:6%;text-align:center;font-family:Inter,"Noto Kufi Arabic",Arial,sans-serif;text-shadow:0 3px 9px #000c}
.welcome-preview-avatar{width:27%;aspect-ratio:1;object-fit:cover;border:4px solid var(--welcome-accent);box-shadow:0 5px 20px #0009;flex:0 0 auto}
.welcome-preview-card[data-avatar-shape="circle"] .welcome-preview-avatar{border-radius:50%}
.welcome-preview-card[data-avatar-shape="square"] .welcome-preview-avatar{border-radius:15%}
.welcome-preview-copy{display:grid;gap:5px;min-width:0;max-width:100%;line-height:1.15}
.welcome-preview-title{color:var(--welcome-accent);font-size:clamp(13px,3.5vw,29px);font-weight:900;letter-spacing:.04em;overflow-wrap:anywhere}
.welcome-preview-name{font-size:clamp(15px,4vw,34px);font-weight:900;overflow-wrap:anywhere}
.welcome-preview-server{font-size:clamp(10px,2.15vw,18px);font-weight:800;opacity:.96;overflow-wrap:anywhere}
.welcome-preview-card[data-layout="left"] .welcome-preview-content,.welcome-preview-card[data-layout="right"] .welcome-preview-content{flex-direction:row;gap:8%;text-align:start;direction:ltr}
.welcome-preview-card[data-layout="left"] .welcome-preview-avatar{order:0;width:23%}
.welcome-preview-card[data-layout="left"] .welcome-preview-copy{order:1;text-align:start}
.welcome-preview-card[data-layout="right"] .welcome-preview-avatar{order:1;width:23%}
.welcome-preview-card[data-layout="right"] .welcome-preview-copy{order:0;text-align:end}
.welcome-preview-card[data-layout="text"] .welcome-preview-avatar{display:none}
.welcome-preview-card[data-layout="text"] .welcome-preview-content{gap:4%}
.welcome-preview-note{margin-top:8px;color:#8090a3;font-size:9px;line-height:1.8}
@media(max-width:1050px){.welcome-builder-grid{grid-template-columns:1fr}.welcome-preview-frame{position:static;max-width:760px;margin:0 auto;width:100%}}
@media(max-width:520px){.welcome-builder-controls{grid-template-columns:1fr}.welcome-builder-controls .field.full{grid-column:auto}.welcome-layout-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome-color-row{grid-template-columns:1fr}.welcome-preview-card{border-radius:9px}.welcome-preview-avatar{border-width:2px}}
.welcome-control-heading{grid-column:1/-1;border-top:1px solid #293849;padding-top:9px;margin-top:4px}
.welcome-control-heading h3{margin:0;color:#f2f5fa;font-size:11px}
.welcome-control-heading p{margin:4px 0 0;color:#8d9caf;font-size:9px;line-height:1.7}
.welcome-range-field label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.welcome-range-field output{font:10px monospace;color:#f0939b;white-space:nowrap}
.welcome-range-field input[type=range]{accent-color:#ed3545;padding:0}
.welcome-preview-card{aspect-ratio:1200/675;background-position:center;background-size:cover;container-type:inline-size}
.welcome-preview-card:before,.welcome-preview-card:after,.welcome-preview-bottom-line{display:none}
.welcome-preview-shade{z-index:1}
.welcome-preview-nameplate{position:absolute;z-index:1;left:calc(var(--name-x,51.1%) - 5.1%);top:var(--name-y,58%);width:35%;height:16.75%;object-fit:fill;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 4px #0008);pointer-events:none}
.welcome-preview-avatar{position:absolute;z-index:2;left:var(--avatar-x,82.8%);top:var(--avatar-y,40.9%);width:var(--avatar-size,17.2%);height:auto;aspect-ratio:1;object-fit:cover;border:0;border-radius:50%;box-shadow:0 2px 10px #0008;transform:translate(-50%,-50%);cursor:grab;touch-action:none;user-select:none}
.welcome-preview-avatar:active,.welcome-preview-name:active{cursor:grabbing}
.welcome-preview-name{position:absolute;z-index:3;left:var(--name-x,51.1%);top:var(--name-y,58%);width:max-content;max-width:none;overflow:visible;white-space:nowrap;text-align:center;line-height:1;letter-spacing:.07em;font-size:var(--name-font-size,24px);font-weight:900;-webkit-text-stroke:.7px #171a1d;paint-order:stroke fill;text-shadow:0 1px 0 #fff8,0 2px 0 #777d83,0 3px 6px #000;transform:translate(-50%,-50%);transform-origin:center center;cursor:grab;touch-action:none;user-select:none}
.welcome-preview-card[data-image-enabled=false] .welcome-preview-avatar,.welcome-preview-card[data-image-enabled=false] .welcome-preview-name{display:none}
.welcome-preview-caption{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 8px;color:#f1f4f8;font-size:10px}
.welcome-preview-caption b{padding:5px 9px;border:1px solid #594046;border-radius:99px;background:#21171b;color:#ffadb4;font-size:10px}
.welcome-preview-caption span{max-width:75%;overflow-wrap:anywhere;color:#bac5d3}
.welcome-preview-note{font-size:10px;text-align:center}
@media(max-width:520px){.welcome-control-heading{grid-column:1}.welcome-preview-card{border-radius:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="mark">◈</div>
  <div class="brand"><b>S.W.A.T. REDLINE</b><span>BOT COMMAND CENTER</span></div>
  <div class="top-right">
    <span class="status" id="connectionBadge">جاري التحقق من الاتصال</span>
    <button class="btn" id="languageButton" type="button">EN</button>
    <button class="btn" id="refreshButton" type="button">↻ تحديث</button>
    <button class="btn danger" id="backButton" type="button">← العودة للموقع</button>
  </div>
</header>
<div class="layout">
  <aside class="side">
    <div class="side-label">COMMAND MODULES</div>
    <button class="active" data-view="overview"><span class="ic">▦</span>نظرة عامة</button>
    <button data-view="server"><span class="ic">♙</span>السيرفر والرتب</button>
    <button data-view="messages"><span class="ic">✉</span>الرسائل والإعلانات</button>
    <button data-view="moderation"><span class="ic">⛨</span>الإشراف والعقوبات</button>
    <button data-view="automod"><span class="ic">⛉</span>الحماية التلقائية</button>
    <button data-view="logs"><span class="ic">≋</span>إدارة اللوجات</button>
    <button data-view="welcome"><span class="ic">✦</span>الترحيب والمغادرة</button>
    <button data-view="integrations"><span class="ic">⌁</span>التكاملات الخارجية</button>
    <button data-view="modules"><span class="ic">◈</span>حالة الأنظمة</button>
    <div class="side-foot">S.W.A.T. REDLINE<br>SECURE BOT MANAGEMENT<br><b style="color:#ed5360">AUTHORIZED PERSONNEL ONLY</b></div>
  </aside>
  <main class="main" id="mainView">
    <div class="loading"><div><div class="spinner"></div>جاري تحميل بيانات Discord...</div></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/bot-command-center-app.js" defer></script>
</body>
</html>
