name: Sync Discord access-role members

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: swat-redline-discord-role-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request a short-lived GitHub identity token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub OIDC token endpoint is unavailable." >&2
            exit 1
          fi
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=swat-redline-discord-role-sync")"
          token="$(jq -r '.value // empty' <<< "$response")"
          if [[ -z "$token" ]]; then
            echo "GitHub did not issue an OIDC token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Wait for the matching Vercel production deployment
        shell: bash
        run: sleep 25

      - name: Synchronize members who have the S.W.A.T. access role
        shell: bash
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 70 \
            -o "$response_file" -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_OIDC_TOKEN}" \
            "https://swat-redline.vercel.app/api/admin/members?task=sync_discord_role_members")"
          cat "$response_file"
          if [[ "$status" == "403" ]] && [[ "$(jq -r '.code // empty' "$response_file")" == "50001" ]]; then
            echo "::warning title=Enable Server Members Intent::Discord has not granted the bot access to list guild members. Enable Server Members Intent in the Discord Developer Portal; scheduled synchronization will retry automatically."
            exit 0
          fi
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Discord role synchronization failed with HTTP $status."
            exit 1
          fi
